<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poly – Companion Chat</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e; color: #e0e0e0;
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; padding: 16px;
    }
    .chat-container {
      max-width: 500px; width: 100%;
      background: #16213e; border-radius: 20px;
      overflow: hidden; box-shadow: 0 8px 30px rgba(0,0,0,0.5);
      display: flex; flex-direction: column;
    }
    .chat-header {
      background: #0f3460; padding: 16px;
      display: flex; align-items: center; gap: 12px;
    }
    .avatar {
      width: 48px; height: 48px; border-radius: 50%;
      background: #533483; object-fit: cover;
    }
    .header-text h2 { font-size: 1.1rem; }
    .header-text p { font-size: 0.8rem; opacity: 0.7; }
    .messages {
      flex: 1; overflow-y: auto; padding: 16px;
      display: flex; flex-direction: column; gap: 8px;
      max-height: 400px;
    }
    .message {
      max-width: 80%; padding: 10px 14px; border-radius: 18px;
      line-height: 1.4; font-size: 0.95rem;
      white-space: pre-wrap; /* so <br> replacement shows line breaks */
    }
    .message.user {
      align-self: flex-end; background: #533483; color: white;
      border-bottom-right-radius: 4px;
    }
    .message.pal {
      align-self: flex-start; background: #1f4068; color: #e0e0e0;
      border-bottom-left-radius: 4px;
    }
    .input-area {
      display: flex; padding: 12px; gap: 8px;
      background: #0f3460;
    }
    .input-area input {
      flex: 1; padding: 12px; border: none; border-radius: 20px;
      background: #1a1a2e; color: white; font-size: 0.95rem;
    }
    .input-area button {
      padding: 12px 20px; border: none; border-radius: 20px;
      background: #533483; color: white; font-weight: bold;
      cursor: pointer;
    }
    .input-area button:disabled { opacity: 0.5; cursor: default; }
    .typing {
      font-size: 0.8rem; padding: 0 16px 8px; opacity: 0.6;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      <img class="avatar" src="https://sites-moca.ethoswarm.ai/poly/portraits/poly-portrait-7" alt="Poly" />
      <div class="header-text">
        <h2>Poly</h2>
        <p>Online</p>
      </div>
    </div>
    <div class="messages" id="messages"></div>
    <div class="typing" id="typing" style="display:none;">Poly is typing…</div>
    <div class="input-area">
      <input type="text" id="userInput" placeholder="Type a message…" autofocus />
      <button id="sendBtn" onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    const PAL_ID = 'b74d3018-8334-4412-a1f5-93703ac262c8';
    const API_URL = 'https://companion-backend-pk75.onrender.com/api/chat';

    const messagesDiv = document.getElementById('messages');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const typingDiv = document.getElementById('typing');

    async function sendMessage() {
      const message = userInput.value.trim();
      if (!message) return;

      // Disable UI
      sendBtn.disabled = true;
      userInput.disabled = true;
      typingDiv.style.display = 'block';

      // Show user message immediately
      addMessage(message, 'user');

      // Clear input
      userInput.value = '';

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ palId: PAL_ID, message }),
        });

        if (!res.ok) {
          const err = await res.json().catch(() => ({ error: 'Request failed' }));
          throw new Error(err.error || 'Request failed');
        }

        const data = await res.json();
        // Replace <br> with actual line breaks
        const reply = data.reply.replace(/<br\s*\/?>/gi, '\n');
        addMessage(reply, 'pal');
      } catch (e) {
        addMessage(`Error: ${e.message}`, 'pal');
      } finally {
        sendBtn.disabled = false;
        userInput.disabled = false;
        userInput.focus();
        typingDiv.style.display = 'none';
      }
    }

    function addMessage(text, sender) {
      const div = document.createElement('div');
      div.className = `message ${sender}`;
      div.textContent = text;
      messagesDiv.appendChild(div);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    // Send on Enter
    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
  </script>
</body>
</html>
